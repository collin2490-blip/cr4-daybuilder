<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CR.4 Daybuilder v1.4 — pilot</title>

<!-- PWA: installeerbaar + offline (zie LEESMIJ.txt voor installatie) -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daybuilder">
<meta name="theme-color" content="#6b7a8f">

<!--
=====================================================================
 VERBORGEN INSTRUCTIES / APP-FEATURES — NIET BOUWBAAR IN LOS HTML-BESTAND
=====================================================================
 1. "Nieuwe dag maken -> nieuwe tab" bij uploaden. Vervangen door de
    datum-navigatie + weekstrip/maandkalender in de Kalender-tab.
 2. Upload van een agenda-screenshot -> automatisch items aanmaken.
    Vereist beeldherkenning (vision/OCR) + backend. Niet mogelijk
    offline in los HTML. De Kalender-tijdlijn is qua STRUCTUUR
    gemodelleerd naar de meegeleverde schoolagenda-screenshot
    (genummerde blokken, tijd + locatie, nu-lijntje).
 3. Echte swipe-gestures i.p.v. tabs.
 4. Kalender-API-koppeling (Google/Outlook).
 5. Echte push-/systeemmeldingen voor de countdown en de
    slaap-afbouwmelding. Dit bestand toont die meldingen alleen
    passief ZOLANG de pagina open/zichtbaar is in de browser/app.
 6. v1.2 heeft nu wel een service worker (offline cache + installeer-
    baar), maar dat is geen pushmeldingen-infrastructuur — daarvoor
    is een server/push-service nodig.
 7. (v1.4) "Woordje vooraf": nu zelf in te vullen. In de app schrijft de
    GA (Guardian Angel) dit woordje zelf; de gebruiker kan het aanpassen.
 8. (v1.4) "Link naar andere CR-module" uit de item-details gehaald —
    bouwen in de app (modules die elkaar openen).
 9. (v1.4) "Capture the moment" is hier een kleine logboek-tijdlijn.
    In de app: inspreken via de GA ("ik voel me net verdrietig") en een
    aparte Logboek-module met weken/maanden, grafieken en suggesties.
10. (v1.4) Dagstructuur: in de app laadt elke keuze (Gewone dag,
    Weekend, ...) een voorgeprogrammeerd dagsjabloon.
11. (v1.4) Slot: in de app duidelijker maken voor nieuwe gebruikers
    (nu een stipje dat gloeit als het vergrendeld is).
=====================================================================
-->

<style>
/* =====================================================================
   HUISSTIJL — klein, rustig, kalm. Kleur alleen als klein accent.
   ===================================================================== */
:root{
  --bg:#f5f4f0;
  --panel:#ffffff;
  --panel-alt:#faf9f6;
  --ink:#2a2d31;
  --muted:#8b8f97;
  --faint:#c3c6cc;
  --line:#e6e4de;
  --accent:#6b7a8f;
  --good:#7f9b7a;
  --warn:#c9a24b;
  --bad:#b6615a;
  --neutral:#b7bbc2;
  --r:10px;
  --r-sm:6px;
  --shadow:0 2px 10px rgba(30,30,25,.07);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
#app{max-width:640px;margin:0 auto;padding:10px 10px 74px;min-height:100vh;position:relative}

header#topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 2px 8px}
.dateNav{display:flex;align-items:center;gap:4px}
.dateNav button.navBtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:20px;height:20px;font-size:11px;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.dateLabel{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px;font-size:10px;font-weight:800;color:var(--ink);cursor:pointer}
.iconRow{display:flex;gap:4px;margin-left:auto}
.iconBtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;width:26px;height:26px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.iconBtn:hover{background:var(--panel-alt)}

nav.tabbar{display:flex;gap:4px;margin:2px 0 10px;padding:3px;background:var(--panel-alt);border:1px solid var(--line);border-radius:999px}
nav.tabbar .tab{flex:1;border:0;background:transparent;border-radius:999px;padding:6px 4px;font-size:11px;font-weight:800;color:var(--muted);cursor:pointer}
nav.tabbar .tab.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}

.view{display:none}
.view.active{display:block}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;box-shadow:var(--shadow)}
.sectionLabel{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:800;margin:0 0 6px;display:flex;align-items:center;gap:6px}

.framing{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.framing .full{grid-column:1/-1}
.framing label{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}
.framing input[type=text],.framing select{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 7px;font-size:12px;background:var(--panel-alt);color:var(--ink)}
.guardNote{font-size:10px;color:var(--faint);margin-top:5px;font-style:italic}

/* groene plus-knop + toevoeg-menu (vervangt de rij losse knoppen) */
.addFab{border:0;background:var(--good);color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;line-height:1;flex:none}
.addFab:hover{filter:brightness(.95)}
.addMenuPopup{position:absolute;right:10px;top:40px;z-index:45;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 34px rgba(0,0,0,.16);padding:6px;width:180px}
.addMenuPopup button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;border-radius:6px}
.addMenuPopup button:hover{background:var(--panel-alt)}
.addMenuPopup .soft{background:#f1efe9;border-radius:8px;margin-top:4px;padding:2px}
.addMenuPopup .soft button{color:var(--muted);font-weight:600}

/* item card — compacter, bediening rechts, meer/minder rechtsboven */
.item{position:relative;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-alt);margin-bottom:6px;overflow:hidden}
.item.carried{border-color:#d8cfa9}
.item.locked{opacity:.92}
.item.locked .titleInput,.item.locked .motifLine{opacity:.65}
.item .expandBtn{position:absolute;top:6px;right:8px;border:0;background:transparent;color:var(--faint);font-size:10px;cursor:pointer}
.item .row1{display:flex;align-items:flex-start;gap:6px;padding:7px 30px 5px 8px}
.item .reorder{display:flex;flex-direction:column;gap:0;width:11px}
.item .reorder button{border:0;background:transparent;color:var(--faint);font-size:9px;cursor:pointer;line-height:1.1;padding:1px}
.item input[type=checkbox].done{margin-top:3px;width:14px;height:14px;accent-color:var(--good);flex:none}
.item .main{flex:1;min-width:0}
.item .titleRow{display:flex;align-items:center;gap:5px}
.item .iconGlyph{font-size:12px;flex:none}
.item input.titleInput{width:100%;border:0;background:transparent;font-size:13px;font-weight:700;color:var(--ink);padding:0}
.item input.titleInput:focus{outline:none}
.item.isdone .titleInput{color:var(--faint);text-decoration:line-through}
.motifRow{margin-top:1px}
.motifArrow{border:0;background:transparent;color:var(--faint);font-size:10px;cursor:pointer;padding:0}
.motifInput{width:100%;border:1px solid var(--line);background:#f3f1ec;border-radius:5px;padding:3px 5px;font-size:11px;font-style:italic;color:var(--ink)}
.motifLine{font-size:11px;color:var(--muted);font-style:italic;cursor:text}
.messageLine{font-size:10px;color:var(--accent);margin-top:2px}

.item .meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:5px;padding:0 8px 7px}
.tagChip select{border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:10px;padding:2px 6px;color:var(--ink);max-width:110px}
.tagDot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:4px}
.durBadge{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px;background:var(--panel)}
.timeBadge{font-size:10px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:2px 7px;background:var(--panel);font-weight:800}
.reqChip{font-size:9px;border:1px dashed var(--line);border-radius:999px;padding:2px 6px;color:var(--faint);cursor:pointer;background:transparent}
.reqChip.on{border-style:solid;border-color:var(--bad);color:var(--bad)}
.ctrlCluster{display:flex;align-items:center;gap:4px;margin-left:auto}
.infBtn{border:0;background:transparent;font-size:12px;color:var(--faint);cursor:pointer;line-height:1}
.infBtn.on{color:var(--accent)}
.infBtn:disabled,.lockBtn:disabled{opacity:.4;cursor:default}
.lockBtn{border:0;background:transparent;cursor:pointer;width:16px;height:16px;display:inline-flex;align-items:center;justify-content:center}
.lockBtn .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:#cfd2d6;transition:all .15s}
.lockBtn.on .dot{width:9px;height:9px;background:#fff;box-shadow:0 0 6px 2px rgba(255,255,255,.95),0 0 0 1px #c9cdd3}
.delBtn{border:0;background:transparent;color:var(--faint);font-size:13px;cursor:pointer;line-height:1}
.delBtn:disabled{opacity:.3;cursor:default}

.item .detail{display:none;border-top:1px solid var(--line);padding:8px;background:var(--panel)}
.item.expanded .detail{display:block}
.item .detail label{display:block;font-size:10px;color:var(--muted);margin:6px 0 2px}
.item .detail textarea,.item .detail input[type=text]{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 7px;font-size:12px}
.item .detail textarea{min-height:40px;resize:vertical}
.item .detail input:disabled,.item .detail textarea:disabled,.item .detail select:disabled,
.item .detail input[readonly],.item .detail textarea[readonly]{background:#eeece6;color:var(--muted);cursor:not-allowed}
.subtask{display:flex;align-items:center;gap:5px;margin:3px 0}
.subtask input[type=text]{flex:1;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:11px}
.subtask button{border:0;background:transparent;color:var(--faint);font-size:12px;cursor:pointer}
.subtask button:disabled{opacity:.3;cursor:default}
.rangeRow{display:flex;align-items:center;gap:6px;width:100%;margin-top:6px}
.rangeRow input[type=range]{flex:1;accent-color:var(--accent)}
.detailActions{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.detailActions button{border:1px solid var(--line);background:var(--panel-alt);border-radius:999px;padding:4px 9px;font-size:10px;cursor:pointer;color:var(--ink)}
.detailActions button:disabled{opacity:.4;cursor:default}
.iconPick{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.iconPick button{border:1px solid var(--line);background:var(--panel);border-radius:6px;width:24px;height:24px;font-size:12px;cursor:pointer}
.iconPick button.on{border-color:var(--accent);background:var(--panel-alt)}
.iconPick button:disabled{opacity:.4;cursor:default}

/* live view */
.nowStack{display:flex;flex-direction:column;gap:6px}
.nowSide{opacity:.7;padding:7px 10px;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-alt)}
.nowSide b{color:var(--ink);font-weight:700}
.nowCurrent{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:18px 14px;box-shadow:var(--shadow);text-align:center}
.nowCurrent .cur-eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:800}
.nowCurrent .cur-title{font-size:19px;font-weight:800;color:var(--ink);margin-top:4px}
.nowCurrent .cur-why{font-size:11px;color:var(--muted);font-style:italic;margin-top:4px}
.nowCurrent .cur-msg{font-size:11px;color:var(--accent);margin-top:4px}
.nowCurrent .cur-meta{margin-top:9px;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.nowCurrent .cur-done{margin-top:12px;border:1px solid var(--good);color:var(--good);background:transparent;border-radius:999px;padding:7px 18px;font-size:12px;font-weight:800;cursor:pointer}
.countdown{font-size:10px;color:var(--faint);margin-top:6px}
.allDoneMsg{text-align:center;padding:20px 10px;color:var(--muted);font-size:12px}
.reflectRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.reflectBtn{position:relative;overflow:hidden;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:8px;font-size:11px;text-align:center;cursor:pointer;color:var(--muted)}
.reflectBtn.active{border-color:var(--accent);color:var(--ink);background:var(--panel-alt);font-weight:700}
.sleepBanner{font-size:11px;color:var(--accent);background:var(--panel-alt);border:1px dashed var(--line);border-radius:999px;padding:6px 10px;text-align:center;margin-bottom:8px}
.backupReminder{font-size:10px;color:var(--muted);background:var(--panel-alt);border:1px dashed var(--line);border-radius:999px;padding:5px 10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.backupReminder a{color:var(--accent);cursor:pointer;text-decoration:underline}
.backupReminder button{border:0;background:transparent;color:var(--faint);font-size:12px;cursor:pointer;margin-left:8px}

.statusLine{display:flex;align-items:center;font-size:11px;color:var(--muted)}
.statusDot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;flex:none}

/* panels / modals */
.overlayBg{position:fixed;inset:0;background:rgba(30,28,24,.28);z-index:40}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--panel);box-shadow:-8px 0 24px rgba(0,0,0,.14);z-index:50;overflow-y:auto;padding:12px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,92vw);max-height:86vh;overflow-y:auto;background:var(--panel);border-radius:var(--r);box-shadow:0 20px 50px rgba(0,0,0,.28);z-index:55;padding:14px}
.hidden{display:none!important}
.panelHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.panelHead .t{font-size:12px;font-weight:800}
.closeX{border:0;background:transparent;font-size:16px;color:var(--muted);cursor:pointer}

.libCatHead{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin:10px 0 4px}
.libCatTitle{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:800}
.libCatArrow{font-size:10px;color:var(--faint)}
.libItem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:var(--r-sm);padding:7px;margin-bottom:6px;background:var(--panel-alt)}
.libIcon{font-size:15px;flex:none}
.libItem .t{font-size:12px;font-weight:700}
.libItem .w{font-size:10px;color:var(--muted);font-style:italic}
.libItem .actions{margin-left:auto;display:flex;gap:4px}
.libItem button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 9px;font-size:10px;cursor:pointer}

.energyCat{margin-bottom:8px}
.energyCat .catTitle{font-size:11px;font-weight:800;color:var(--accent);margin-bottom:4px}
.energyRow{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;border-bottom:1px dashed var(--line)}
.scorePip{font-size:10px;color:var(--muted)}
.deescStep{font-size:11px;padding:4px 0;border-bottom:1px dashed var(--line);display:flex;gap:6px}
.deescStep b{color:var(--accent);font-size:10px}
.quote{font-size:11px;font-style:italic;color:var(--ink);background:var(--panel-alt);border-left:2px solid var(--accent);padding:6px 8px;border-radius:0 6px 6px 0;margin:4px 0}
.moodTrailRow{display:flex;align-items:center;gap:6px;margin-top:4px}
.moodTrail{display:flex;gap:3px}
.moodDot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.legendArrow{border:0;background:transparent;color:var(--faint);font-size:10px;cursor:pointer}
.legendBox{display:none;margin-top:6px;font-size:10px;color:var(--muted)}
.legendBox.open{display:block}
.legendRow{display:flex;align-items:center;gap:5px;padding:2px 0}
.legendDot{width:8px;height:8px;border-radius:50%;flex:none}

.meter{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 10px}
.meterBox{width:12px;height:9px;border-radius:2px;border:1px solid var(--line);background:var(--panel-alt)}
.meterBox.on{background:var(--good);border-color:var(--good)}
.essItem{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.essItem input{accent-color:var(--good)}
.pointsWeek{display:flex;gap:4px;margin-top:10px}
.pointsWeekCol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.pointsWeekBar{width:100%;height:30px;background:var(--panel-alt);border:1px solid var(--line);border-radius:4px;display:flex;align-items:flex-end;overflow:hidden}
.pointsWeekBar i{display:block;width:100%;background:var(--good)}
.pointsWeekLbl{font-size:8px;color:var(--faint)}

.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:7px 12px;font-size:11px;display:flex;gap:10px;align-items:center;z-index:70}
.toast button{border:0;background:transparent;color:#bcd;cursor:pointer;font-size:11px;font-weight:800}

#ankerBtn{position:fixed;right:14px;bottom:14px;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:16px;cursor:pointer;z-index:30}

.tipLine{font-size:11px;color:var(--muted);background:var(--panel-alt);border:1px dashed var(--line);border-radius:999px;padding:5px 10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;cursor:pointer}

.feelGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:4px}
.feelBtn{border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);padding:10px 6px;font-size:12px;text-align:center;cursor:pointer}
.feelBtn:hover{background:var(--panel-alt)}

.chklist{margin-top:4px}
.chkrow{display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 0}

.lockGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}
.lockGrid button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:5px 0;font-size:10px;cursor:pointer}
.lockGrid button.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* kalender */
.weekStrip{display:flex;justify-content:space-between;margin-bottom:6px}
.weekDay{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;border-radius:8px;cursor:pointer}
.weekDay.today{background:var(--panel-alt);border:1px solid var(--accent)}
.weekDay .wd{font-size:9px;color:var(--faint);text-transform:uppercase}
.weekDay .wn{font-size:12px;font-weight:700}
.weekDay .wdot{width:6px;height:6px;border-radius:50%;background:var(--line)}
.monthLabelBtn{border:0;background:transparent;color:var(--ink);font-size:11px;font-weight:700;padding:3px 6px;border-radius:6px;cursor:pointer}
.monthLabelBtn:hover{background:var(--panel-alt)}
.monthPopup{position:absolute;z-index:60;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 14px 34px rgba(0,0,0,.16);padding:10px;width:260px}
.monthGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:6px}
.monthCell{text-align:center;font-size:10px;padding:5px 0;border-radius:6px;cursor:pointer;position:relative}
.monthCell.today{border:1px solid var(--accent)}
.monthCell .pdot{width:3px;height:3px;border-radius:50%;background:var(--accent);margin:1px auto 0}
.timelineWrap{position:relative}
.tlRow{display:flex;align-items:flex-start;gap:6px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.tlRow.dragOver{background:var(--panel-alt);border-radius:6px}
.tlRow.dragging{opacity:.4}
.tlHandle{cursor:grab;touch-action:none;color:var(--faint);font-size:11px;padding:2px 2px;margin-top:2px;user-select:none}
.tlNum{width:20px;height:20px;border-radius:5px;background:var(--panel-alt);border:1px solid var(--line);font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
.tlBody{flex:1;min-width:0}
.tlTitle{font-size:12px;font-weight:700}
.tlTitle.isdone{color:var(--faint);text-decoration:line-through}
.tlMeta{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.tlTimeInput{border:1px solid var(--line);border-radius:999px;background:var(--panel);font-size:10px;padding:1px 6px;color:var(--ink);font-weight:700}
.tlCheck{margin-top:2px}
.nowLine{position:absolute;left:0;right:0;height:1px;background:var(--bad);z-index:2}
.nowLine::before{content:"";position:absolute;left:-2px;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.closingRow{margin-top:6px}
.ratingRow{display:flex;gap:4px;margin-top:4px}
.ratingRow button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 0;font-size:12px;cursor:pointer}
.ratingRow button.on{border-color:var(--accent);background:var(--panel-alt);font-weight:800}

footer.tiny{text-align:center;font-size:10px;color:var(--faint);margin-top:16px}

/* ===================== v1.4 ===================== */
.iconBtn:disabled{opacity:.35;cursor:default}
/* ?-icoontje + uitlegregel */
.helpBtn{border:1px solid var(--line);background:var(--panel);color:var(--faint);width:13px;height:13px;border-radius:50%;font-size:8px;font-weight:800;line-height:1;padding:0;margin-left:4px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle}
.helpText{display:none;font-size:10px;color:var(--muted);font-style:italic;margin:2px 0 3px}
.helpText.open{display:block}
.framingHead{font-size:10px;color:var(--muted);margin-bottom:2px;display:flex;align-items:center}
.framingHead.big{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:var(--faint);margin-top:4px}
/* groene + exact gecentreerd (getekend i.p.v. een tekst-plus) */
.addFab{position:relative;font-size:0}
.addFab::before,.addFab::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:1px;transform:translate(-50%,-50%)}
.addFab::before{width:12px;height:2px}
.addFab::after{width:2px;height:12px}
/* item: vensterknoppen rechtsboven */
.winCtrls{position:absolute;top:5px;right:6px;display:flex;gap:2px;z-index:2}
.winBtn{border:0;background:transparent;width:18px;height:18px;padding:0;cursor:pointer;color:var(--faint);display:inline-flex;align-items:center;justify-content:center;border-radius:4px}
.winBtn:hover{background:var(--line);color:var(--ink)}
.winBtn:disabled{opacity:.3;cursor:default;background:transparent}
.winBtn svg{display:block}
.item .row1{padding-right:66px}
.item.isMin .row1{padding-top:5px;padding-bottom:5px}
.item.isMin .motifRow,.item.isMin .meta,.item.isMin .messageLine{display:none}
.item.isMax .detail{display:block}
.minTime{font-size:10px;color:var(--muted);flex:none}
/* titelveld: onderstreept zolang leeg, weg tijdens typen */
.item input.titleInput{border-bottom:1px solid transparent}
.item input.titleInput:placeholder-shown{border-bottom:1px solid var(--faint)}
.item input.titleInput:focus{border-bottom-color:transparent}
.item input.titleInput::placeholder{color:var(--faint);font-weight:600}
/* Dag/Moment-schakelaar */
.dayToggle{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 8px;font-size:10px;font-weight:700;color:var(--muted);cursor:pointer}
.dayToggle.on{border-color:var(--accent);color:var(--accent)}
.dayToggle:disabled{opacity:.5;cursor:default}
/* iconen: gecentreerd */
.iconPick button{display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1;font-size:13px}
.iconPick .moreBtn{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1px}
.item .detail textarea.noteArea{min-height:0;resize:vertical}
.optHint::placeholder{color:var(--faint)}
/* Live: intentie + dagdoel */
.intentBox{text-align:center;margin:2px 0 10px}
.intentText{font-size:13px;font-style:italic;color:var(--ink);line-height:1.4}
.intentLbl{font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:800;margin-bottom:2px}
.dagdoelBtn{border:0;background:transparent;font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:800;cursor:pointer;margin-top:6px}
.dagdoelBox{font-size:11px;color:var(--muted);margin-top:3px}
.dagdoelBox b{color:var(--ink);font-weight:700}
.allDayRow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:8px}
.allDayChip{font-size:10px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 8px;color:var(--muted)}
.allDayChip.done{text-decoration:line-through;color:var(--faint)}
.nowSide .nextMsg{display:block;font-size:10px;color:var(--accent);margin-top:2px}
/* Kalender: twee kalenders, drie weergaven */
.calViewSwitch{display:flex;gap:2px;background:var(--panel-alt);border:1px solid var(--line);border-radius:999px;padding:2px;margin-left:auto}
.calViewSwitch button{border:0;background:transparent;border-radius:999px;font-size:9px;font-weight:800;color:var(--muted);padding:3px 7px;cursor:pointer}
.calViewSwitch button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.calGrid{display:grid;gap:6px}
.calGrid.v-agenda{grid-template-columns:minmax(0,1fr) 30px}
.calGrid.v-ess{grid-template-columns:30px minmax(0,1fr)}
.calGrid.v-compact{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.calStrip{border:1px solid var(--line);background:var(--panel-alt);border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;min-height:120px}
.calStrip .stripLbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);font-weight:800;margin-top:4px}
.calStrip .sdot{width:7px;height:7px;border-radius:50%;background:var(--line)}
.calStrip .sdot.on{background:var(--good)}
.calColHead{font-size:9px;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);font-weight:800;margin-bottom:4px}
.essRow{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 2px;border-bottom:1px dashed var(--line);color:var(--ink)}
.essRow .mk{width:12px;height:12px;border-radius:3px;border:1px solid var(--line);flex:none;display:inline-flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.essRow .mk.on{background:var(--good);border-color:var(--good)}
.essRow.done span.n{color:var(--muted)}
.compactRow{font-size:10px;padding:4px 0;border-bottom:1px dashed var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.compactRow .ct{color:var(--muted);margin-right:4px}
.compactRow.done{color:var(--faint);text-decoration:line-through}
.allDayCal{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
/* Punten: pool, weekkeuze, teller */
.pointsHead{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.editLink{border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:10px;padding:2px 8px;color:var(--muted);cursor:pointer}
.essCount{margin-left:auto;border:1px solid var(--line);background:var(--panel);border-radius:999px;font-size:10px;font-weight:800;padding:2px 8px;cursor:pointer;color:var(--muted)}
.essCount.on{border-color:var(--good);color:var(--good)}
.essName small{color:var(--faint);font-size:10px}
.pickRow{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.pickRow input{accent-color:var(--accent)}
.pickInfo{font-size:11px;color:var(--muted);margin:4px 0 8px}
.poolRow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
.poolRow button{margin-left:auto;border:0;background:transparent;color:var(--faint);font-size:13px;cursor:pointer}
.poolAdd{display:flex;gap:6px;margin-top:8px}
.poolAdd input{flex:1;border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:12px}
.poolAdd button,.primaryBtn{border:1px solid var(--accent);background:var(--panel);color:var(--accent);border-radius:999px;padding:5px 12px;font-size:11px;font-weight:800;cursor:pointer}
.primaryBtn:disabled{opacity:.4;cursor:default}
/* Capture the moment (logboek) */
.ctmHead{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.ctmHead .cnt{font-size:10px;color:var(--faint)}
.ctmBody{margin-top:8px}
.ctmKinds{display:flex;gap:5px;flex-wrap:wrap}
.ctmKind{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;font-size:11px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.ctmKind.on{border-color:var(--accent);background:var(--panel-alt);font-weight:700}
.ctmDot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.ctmForm{margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--panel-alt)}
.ctmChoices{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.ctmChoice{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:3px 9px;font-size:11px;cursor:pointer}
.ctmChoice.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.ctmForm input{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 7px;font-size:12px;margin-bottom:6px;background:var(--panel)}
.ctmList{margin-top:8px}
.ctmEntry{display:flex;gap:7px;align-items:flex-start;padding:5px 0;border-bottom:1px dashed var(--line);font-size:11px}
.ctmEntry .tm{color:var(--faint);font-size:10px;width:32px;flex:none;padding-top:1px}
.ctmEntry .tx{flex:1;min-width:0}
.ctmEntry .tx small{display:block;color:var(--muted);font-style:italic}
.ctmEntry .lbl{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--faint);font-weight:800;margin-right:4px}
.ctmEntry button{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:12px}

@media(min-width:720px){#app{max-width:760px}}
</style>
</head>
<body>

<div id="app">
  <header id="topbar">
    <div class="dateNav">
      <button class="navBtn" id="btnPrevDay" title="Vorige dag">‹</button>
      <button class="dateLabel" id="btnToday" title="Naar vandaag"></button>
      <button class="navBtn" id="btnNextDay" title="Volgende dag">›</button>
    </div>
    <div class="iconRow">
      <button class="iconBtn" id="btnUndo" title="Herstel laatst verwijderde" disabled>↶</button>
      <button class="iconBtn" id="btnTerug" title="Terug op koers">🧭</button>
      <button class="iconBtn" id="btnSettings" title="Instellingen">⚙</button>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-view="builder">Bouwen</button>
    <button class="tab active" data-view="live">Live</button>
    <button class="tab" data-view="calendar">Kalender</button>
    <button class="tab" id="tabPoints" data-view="points">Punten</button>
  </nav>

  <main id="main">

    <!-- ================= LIVE ================= -->
    <section id="view-live" class="view active">
      <div class="statusLine" style="margin-bottom:6px"><span class="statusDot" id="liveStatusDot"></span><span id="liveStatusText"></span></div>
      <div id="backupReminderBox"></div>
      <div id="sleepBannerBox"></div>
      <div id="intentBox"></div>
      <div id="allDayLive"></div>
      <div class="nowStack">
        <div class="nowSide" id="nowPrev"></div>
        <div class="nowCurrent" id="nowCurrentBox"></div>
        <div class="nowSide" id="nowNext"></div>
      </div>

      <div class="card" style="margin-top:10px">
        <div class="sectionLabel">Mini-reflectie — 1 tik</div>
        <div class="reflectRow" id="reflectRow"></div>
      </div>

      <div class="card" id="ctmCard"></div>
    </section>

    <!-- ================= BOUWEN ================= -->
    <section id="view-builder" class="view">
      <div class="card">
        <div class="sectionLabel">Framing</div>
        <div class="framing" id="framingBox"></div>
      </div>

      <div class="card" style="position:relative">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
          <div class="sectionLabel" style="margin:0">Onderdelen</div>
          <div style="display:flex;gap:6px;align-items:center">
            <button class="iconBtn" id="btnLibraryInline" title="Library">📖</button>
            <button class="addFab" id="btnAddMenu" title="Toevoegen">+</button>
          </div>
        </div>
        <div id="addMenuPopup" class="addMenuPopup hidden"></div>
        <div id="builderList"></div>
      </div>
    </section>

    <!-- ================= KALENDER ================= -->
    <section id="view-calendar" class="view">
      <div class="card" style="position:relative">
        <div class="weekStrip" id="weekStrip"></div>
        <div class="moodTrailRow" style="margin-top:4px">
          <span class="sectionLabel" style="margin:0">Weekstemming</span>
          <button class="legendArrow" data-legend="calLegend">legenda ▾</button>
        </div>
        <div class="legendBox" id="calLegend"></div>
        <div id="monthPopup" class="monthPopup hidden"></div>
      </div>

      <div class="tipLine" id="terugTip"><span>Vastgelopen?</span><span>›</span></div>

      <div class="card">
        <div class="sectionLabel" style="flex-wrap:wrap">
          <span class="statusLine"><span class="statusDot" id="statusDot"></span><span id="statusText">Status</span></span>
          <span id="calPoints"></span>
          <span class="calViewSwitch" id="calViewSwitch"></span>
        </div>
        <div id="calTwoBox"></div>
      </div>

      <div class="card">
        <div class="sectionLabel">Dag afsluiten</div>
        <div id="closingBox"></div>
      </div>
    </section>

    <!-- ================= PUNTEN ================= -->
    <section id="view-points" class="view">
      <div class="card" id="pointsCard"></div>
    </section>

  </main>

  <button id="ankerBtn" title="Anker — ik loop even vast">⚓</button>

  <footer class="tiny">CR.4 Daybuilder v1.4 · pilot · alles lokaal in je browser · offline-geschikt</footer>
</div>

<div id="overlayBg" class="overlayBg hidden"></div>

<aside id="libraryPanel" class="panel hidden">

</aside>

</aside>

</div>

</div>

<input type="file" id="importFile" accept="application/json" class="hidden">
<input type="file" id="importDayFile" accept="application/json,.json" class="hidden">

function $(sel, root){ return (root||document).querySelector(sel); }
function $all(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function uid(p){ return (p||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function pluralOnderdeel(n){ return n===1 ? '1 onderdeel' : n+' onderdelen'; }
function pad(n){ return n<10?'0'+n:''+n; }
function toISO(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fromISO(iso){ const p=iso.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(iso,n){ const d=fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function todayISO(){ return toISO(new Date()); }
function daysBetween(isoA, isoB){ return Math.round((fromISO(isoA)-fromISO(isoB))/86400000); }
const WEEKDAYS = ['zo','ma','di','wo','do','vr','za'];
const WEEKDAYS_MON0 = ['ma','di','wo','do','vr','za','zo']; // index 0 = maandag, voor herhaling
const MONTHS = ['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const MONTHS_SHORT = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
function fmtDateShort(iso){ const d=fromISO(iso); return WEEKDAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS_SHORT[d.getMonth()]; }
function fmtDuration(min){
  if(min==null) return '';
  if(min<60) return min+' min';
  const h=Math.floor(min/60), m=min%60;
  return h+'u'+(m?' '+m:'');
}
function nowMinutes(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function timeToMinutes(t){ if(!t) return null; const p=t.split(':').map(Number); return p[0]*60+p[1]; }
function mondayIndex(jsDay){ return jsDay===0?6:jsDay-1; } // JS: zo=0..za=6 -> ma=0..zo=6

/* ---------- state ---------- */
let STATE = null;

function defaultState(){
  return {
    settings: { countdownEnabled:true, tagDisplayMode:'dot', pointsEnabled:true },
    tags: JSON.parse(JSON.stringify(CONFIG.defaultTags)),
    library: JSON.parse(JSON.stringify(CONFIG.starterLibrary)),
    recurringTemplates: [],
    essentialsChecked: {},
    moods: {},
    days: {},
    lastBackup: null,
    backupReminderDismissedOn: null,
    // v1.4
    essentialPool: JSON.parse(JSON.stringify(CONFIG.essentialPool)),
    weekSelections: {},   // { maandagISO: [10 essential-id's] } — vast per week
    log: {},              // { dateISO: [ {id,time,kind,text,reason,ref} ] } — Capture the moment
    trash: [],            // laatste 3 verwijderde items (herstelknop)
    schema: 14
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(CONFIG.storageKey);
    if(!raw){ STATE = defaultState(); return; }
    const parsed = JSON.parse(raw);
    STATE = Object.assign(defaultState(), parsed);
    STATE.settings = Object.assign(defaultState().settings, parsed.settings||{});
  }catch(e){ STATE = defaultState(); }
  migrateState();
}

/* Zet data uit v1.0–v1.3 om naar v1.4 — verliest niets. Veilig om vaker
   te draaien (idempotent): wordt ook na Importeren aangeroepen. */
function migrateState(){
  const S = STATE;
  // tags: alleen de zes van v1.4; oude tags op items omzetten
  const allowed = Object.keys(CONFIG.defaultTags);
  const mapTag = t => allowed.includes(t) ? t : (CONFIG.tagMigration[t] || 'cr4');
  const newTags = {};
  allowed.forEach(k=>{ newTags[k] = (S.tags && S.tags[k]) ? S.tags[k] : JSON.parse(JSON.stringify(CONFIG.defaultTags[k])); });
  S.tags = newTags;
  const fixItem = it=>{
    if(!it) return;
    it.tag = mapTag(it.tag);
    if(it._expanded!==undefined){ if(it._expanded && !it._view) it._view='max'; delete it._expanded; }
    delete it.essentialLink; delete it.linkModule;
  };
  Object.values(S.days||{}).forEach(d=>{
    (d.items||[]).forEach(fixItem);
    if(d.framing){
      const f = d.framing;
      if(f.situatie && !CONFIG.situaties.includes(f.situatie)){
        f.situatieAnders = f.situatieAnders || f.situatie; f.situatie = 'Anders';
      }
    }
  });
  (S.recurringTemplates||[]).forEach(t=>fixItem(t.data));
  (S.library||[]).forEach(b=>{ b.tag = mapTag(b.tag); delete b.essentialLink; });
  // essentials: oude index-sleutels (0..9) -> id's (e0..e9)
  if(!Array.isArray(S.essentialPool) || !S.essentialPool.length) S.essentialPool = JSON.parse(JSON.stringify(CONFIG.essentialPool));
  CONFIG.essentialPool.forEach(p=>{ if(!S.essentialPool.find(x=>x.id===p.id)) S.essentialPool.push(JSON.parse(JSON.stringify(p))); });
  Object.keys(S.essentialsChecked||{}).forEach(date=>{
    const c = S.essentialsChecked[date]; const out = {};
    Object.keys(c).forEach(k=>{ out[/^\d+$/.test(k) ? 'e'+k : k] = c[k]; });
    S.essentialsChecked[date] = out;
  });
  S.weekSelections = S.weekSelections || {};
  // eerdere weken (vóór v1.4) telden de oude 10 — zet die vast zodat de
  // weekbalkjes blijven kloppen
  const legacy = ['e0','e1','e2','e3','e4','e5','e6','e7','e8','e9'];
  const thisWeek = weekKey(todayISO());
  Object.keys(S.essentialsChecked||{}).forEach(date=>{
    const wk = weekKey(date);
    if(wk < thisWeek && !S.weekSelections[wk]) S.weekSelections[wk] = legacy.slice();
  });
  S.log = S.log || {};
  S.trash = Array.isArray(S.trash) ? S.trash : [];
  S.schema = 14;
}
function weekKey(iso){ return addDays(iso, -mondayIndex(fromISO(iso).getDay())); }
function saveState(){ localStorage.setItem(CONFIG.storageKey, JSON.stringify(STATE)); }

function emptyDay(dateISO){
  return {
    date: dateISO,
    framing: { intentie:'', maxDoel:'', minDoel:'', situatie:CONFIG.situaties[0], situatieAnders:'' },
    items: [],
    closing: { minDoelMet:false, oneLiner:'', dayRating:0, closed:false }
  };
}

/* Bouwt een dag-object (carry-over + herhalend) ZONDER het op te slaan —
   gebruikt om te laten zien wat een dag zou bevatten als je hem bekijkt,
   zonder dat alleen bekijken al een echte dag aanmaakt. */
function buildDayObject(dateISO){
  const day = emptyDay(dateISO);
  const weekdayIdx = mondayIndex(fromISO(dateISO).getDay());

  for(let back=1; back<=7; back++){
    const prevISO = addDays(dateISO, -back);
    const prev = STATE.days[prevISO];
    if(prev){
      prev.items.filter(it=>it.type==='flex' && !it.done && !it.recurringTemplateId).forEach(it=>{
        const clone = Object.assign({}, it, { id: uid('item'), carriedOver:true, order: day.items.length });
        delete clone._expanded; delete clone._motifEditing;
        day.items.push(clone);
      });
      break;
    }
  }

  STATE.recurringTemplates.forEach(t=>{
    const days = t.repeatDays || [];
    if(days.length && !days.includes(weekdayIdx)) return;
    day.items.push(Object.assign({}, t.data, {
      id: uid('item'), done:false, carriedOver:false, order: day.items.length,
      recurringTemplateId:t.templateId, recurring:true
    }));
  });

  return day;
}
/* Alleen-lezen weergave van een dag — maakt NIETS aan in STATE.days.
   Gebruik dit in alle render-functies (bekijken mag nooit persisten). */
function peekDay(dateISO){
  return STATE.days[dateISO] || buildDayObject(dateISO);
}
/* Dag die écht iets met zich laat doen (item toevoegen/afvinken, framing
   invullen, ...). Wordt pas nu, op het moment van een echte actie,
   aangemaakt en opgeslagen — niet door alleen te bekijken/bladeren. */
function getDay(dateISO){
  if(STATE.days[dateISO]) return STATE.days[dateISO];
  const day = buildDayObject(dateISO);
  STATE.days[dateISO] = day;
  saveState();
  return day;
}

/* ---------- item helpers ---------- */
const TYPE_LABEL = { vast:'Vast moment', flex:'Flexibel moment', werkblok:'Werkmoment', joy:'Act of joy', health:'Act of health' };
const TYPE_DEFAULT_TAG = { vast:'cr4', flex:'cr4', werkblok:'werk', joy:'prive', health:'cr1' };

function newItem(type){
  return {
    id: uid('item'), type: type,
    title:'', why:'', tag: TYPE_DEFAULT_TAG[type] || 'cr4',
    icon: CONFIG.defaultIcon[type] || '📌',

    allDay:false,

  };

/* "Dag"-items (hele dag) staan bovenaan; daarna items met een tijd
   chronologisch; items zonder tijd achteraan op hun ▲▼-volgorde. */
function sortKey(it){
  if(it.allDay) return -1e7 + (it.order||0);
  if(it.time){ return timeToMinutes(it.time) + (it.order||0)/1e6; }
  return 1e7 + (it.order||0);
}
function isMoment(it){ return !it.allDay; }
function orderedItems(day){ return day.items.slice().sort((a,b)=>sortKey(a)-sortKey(b)); }
function durationIndex(min){
  let idx = CONFIG.durationSteps.indexOf(min);
  if(idx<0){ idx=0; let best=Infinity; CONFIG.durationSteps.forEach((v,i)=>{ const d=Math.abs(v-(min||0)); if(d<best){best=d; idx=i;} }); }
  return idx;
}

/* Houdt een gekoppelde herhaal-template in sync met het item. */
function syncTemplate(it){
  if(!it.recurring || !it.recurringTemplateId) return;
  const t = STATE.recurringTemplates.find(x=>x.templateId===it.recurringTemplateId);
  if(!t) return;
  t.data = Object.assign({}, t.data, {
    type:it.type, title:it.title, why:it.why, tag:it.tag, icon:it.icon,
    time:it.time, location:it.location, message:it.message, duration:it.duration,
    required:it.required, isSleep:it.isSleep, windDown:it.windDown, allDay:!!it.allDay
  });
}

/* ---------- status ---------- */
/* Status volgt uitsluitend je EIGEN geplande tijden, geen vaste klokuren.
   neutral = nog niets aan de hand (startstatus); orange = iets met een
   geplande tijd loopt net achter; red = ruim voorbij de drempel. */
function computeStatus(day, dateISO){
  if(day.items.length===0) return 'neutral';
  const required = day.items.filter(it=>it.required);
  const requiredDone = required.length===0 || required.every(it=>it.done);
  const minDoelMet = day.closing.minDoelMet || !day.framing.minDoel;
  if(requiredDone && minDoelMet) return 'green';

  if(dateISO===todayISO()){
    const now = nowMinutes();
    const red = required.some(it=>!it.done && it.time && (now - timeToMinutes(it.time)) >= CONFIG.overdueThresholdMinutes);
    if(red) return 'red';
    const orange = required.some(it=>!it.done && it.time && now > timeToMinutes(it.time));
    if(orange) return 'orange';
  }
  return 'neutral';
}
const STATUS_LABEL = { neutral:'Onderweg', green:'Goed genoeg — de dag staat', orange:'Iets loopt achter', red:'Loopt achter op eigen schema' };
const STATUS_COLOR = { neutral:'var(--neutral)', green:'var(--good)', orange:'var(--warn)', red:'var(--bad)' };

/* =====================================================================
   RENDER — LIVE
   ===================================================================== */
function renderLive(){
  const day = peekDay(currentDate);
  const status = computeStatus(day, currentDate);
  $('#liveStatusDot').style.background = STATUS_COLOR[status];
  $('#liveStatusText').textContent = STATUS_LABEL[status];

  renderBackupReminder();
  renderSleepBanner(day);
  renderIntentBox(day);
  renderCtm();

  const allDay = orderedItems(day).filter(it=>it.allDay);
  $('#allDayLive').innerHTML = allDay.length
    ? `<div class="allDayRow">${allDay.map(it=>`<span class="allDayChip ${it.done?'done':''}">${it.icon?esc(it.icon)+' ':''}${esc(it.title||'(naamloos)')}</span>`).join('')}</div>` : '';

  const items = orderedItems(day).filter(isMoment);
  const notDone = items.filter(it=>!it.done);

  if(items.length===0 && allDay.length){
    $('#nowPrev').innerHTML=''; $('#nowNext').innerHTML='';
    $('#nowCurrentBox').innerHTML = `<div class="allDayMsg" style="text-align:center;padding:14px;color:var(--muted);font-size:12px">Geen momenten met een tijd vandaag.</div>`;
    renderReflect(); return;
  }
  if(items.length===0){
    $('#nowPrev').innerHTML=''; $('#nowNext').innerHTML='';
    $('#nowCurrentBox').innerHTML = `<div class="cur-eyebrow">Nog niets gebouwd</div><div class="cur-title">Ga naar Bouwen</div><div class="cur-why">Voeg een paar onderdelen toe voor vandaag — zo klein als je wilt.</div>`;
    renderReflect(); return;
  }
  if(notDone.length===0){
    $('#nowPrev').innerHTML = items[items.length-2] ? sideLineHTML(items[items.length-2]) : '';
    $('#nowNext').innerHTML = '';
    $('#nowCurrentBox').innerHTML = `<div class="allDoneMsg">Alles afgevinkt voor vandaag.<br>Kijk eventueel nog naar <b>Kalender</b> om af te sluiten.</div>`;
    renderReflect(); return;
  }

  // klok-gestuurd: een getimed item dat nu "loopt" heeft voorrang, anders
  // gewoon het eerstvolgende open item in de eigen (chronologische) volgorde.
  const now = nowMinutes();
  let current = notDone.find(it=>it.time && timeToMinutes(it.time)<=now && (!it.duration || now < timeToMinutes(it.time)+it.duration) && currentDate===todayISO());
  if(!current) current = notDone[0];

  const idx = items.indexOf(current);
  const prev = idx>0 ? items[idx-1] : null;
  const nextIdx = notDone.indexOf(current);
  const next = notDone[nextIdx+1] || null;

  $('#nowPrev').innerHTML = prev ? sideLineHTML(prev) : '<span style="opacity:.4">— start van de dag —</span>';
  $('#nowNext').innerHTML = next ? sideLineHTML(next) + (next.message?`<span class="nextMsg">${esc(next.message)}</span>`:'') : '<span style="opacity:.4">— laatste voor nu —</span>';

  let countdownHTML = '';
  if(STATE.settings.countdownEnabled && currentDate===todayISO()){
    const upcoming = items.filter(it=>it.time && !it.done && timeToMinutes(it.time)>=now);
    if(upcoming.length){
      upcoming.sort((a,b)=>timeToMinutes(a.time)-timeToMinutes(b.time));
      const mins = timeToMinutes(upcoming[0].time) - now;
      countdownHTML = `<div class="countdown">⏱ nog ${mins} min tot "${esc(upcoming[0].title||'vast moment')}" (${upcoming[0].time})</div>`;
    }
  }
  const overdue = current.time && currentDate===todayISO() && timeToMinutes(current.time) < now;
  // Woordje vooraf: alleen zolang het item nog niet begonnen is
  const notStarted = !current.time || currentDate!==todayISO() || timeToMinutes(current.time) > now;

  $('#nowCurrentBox').innerHTML = `
    <div class="cur-eyebrow">${esc(TYPE_LABEL[current.type])}${overdue?' · loopt uit':''}</div>
    <div class="cur-title">${current.icon?esc(current.icon)+' ':''}${esc(current.title || '(naamloos)')}</div>
    ${current.why?`<div class="cur-why">${esc(current.why)}</div>`:''}
    ${(current.message && notStarted)?`<div class="cur-msg">${esc(current.message)}</div>`:''}
    <div class="cur-meta">
      ${current.time?`<span class="timeBadge">${esc(current.time)}${current.location?' · '+esc(current.location):''}</span>`:''}
      ${current.duration?`<span class="durBadge">${fmtDuration(current.duration)}</span>`:''}
      ${tagBadgeHTML(current.tag)}
    </div>
    <button class="cur-done" data-donenow="${current.id}">Klaar — volgende</button>
    ${countdownHTML}
  `;
  renderReflect();
}

function renderSleepBanner(day){

function topIcons(current){
  const count = {};
  const add = ic=>{ if(ic && CONFIG.icons.includes(ic)) count[ic]=(count[ic]||0)+1; };
  Object.values(STATE.days).forEach(d=>(d.items||[]).forEach(it=>add(it.icon)));
  (STATE.library||[]).forEach(b=>add(b.icon));
  let list = CONFIG.icons.slice().sort((x,y)=>(count[y]||0)-(count[x]||0) || CONFIG.icons.indexOf(x)-CONFIG.icons.indexOf(y)).slice(0, CONFIG.iconsShown);
  if(current && CONFIG.icons.includes(current) && !list.includes(current)) list = [current].concat(list.slice(0, CONFIG.iconsShown-1));
  return list;
}

/* ---------- Essentials (punten) helpers ---------- */
function poolItem(id){ return (STATE.essentialPool||[]).find(p=>p.id===id) || {id, name:id}; }
function weekSelection(iso){ return STATE.weekSelections[weekKey(iso)] || null; }
/* Geldige selectie voor een dag: de vastgezette van die week, of (nog niet
   gekozen) een voorstel = vorige week of de eerste 10 uit de pool. */
function proposedSelection(iso){
  const sel = weekSelection(iso); if(sel) return sel;
  const prev = STATE.weekSelections[weekKey(addDays(iso,-7))];
  if(prev) return prev.filter(id=>{ const p=(STATE.essentialPool||[]).find(x=>x.id===id); return p && !p.archived; }).slice(0, CONFIG.pointsPerWeek);
  return (STATE.essentialPool||[]).filter(p=>!p.archived).slice(0, CONFIG.pointsPerWeek).map(p=>p.id);
}
function essVal(iso, id){ const c = STATE.essentialsChecked[iso]||{}; return c[id]; }
function essDone(iso, id){
  const v = essVal(iso,id);
  if(poolItem(id).twice) return (typeof v==='number' ? v : (v?2:0)) >= 2;
  return !!v;
}
function essScore(iso){ const sel = proposedSelection(iso); return { done: sel.filter(id=>essDone(iso,id)).length, total: sel.length }; }

function positionNowLine(items){
  const wrap = $('#dayTimeline');
  const old = $('#nowLineEl'); if(old) old.remove();
  if(currentDate!==todayISO()) return;
  const timed = items.filter(it=>it.time);
  if(timed.length===0) return;
  const now = nowMinutes();
  const rows = $all('.tlRow[data-time]', wrap);
  if(rows.length===0) return;
  let before=null, after=null;
  rows.forEach(r=>{
    const m = timeToMinutes(r.dataset.time);
    if(m<=now) before=r; if(m>=now && !after) after=r;
  });
  let y;
  const wrapTop = wrap.getBoundingClientRect().top;
  if(before && after && before!==after){
    const t1 = before.getBoundingClientRect(), t2 = after.getBoundingClientRect();
    const m1 = timeToMinutes(before.dataset.time), m2 = timeToMinutes(after.dataset.time);
    const frac = m2>m1 ? (now-m1)/(m2-m1) : 0;
    y = (t1.bottom-wrapTop) + frac*((t2.top-wrapTop)-(t1.bottom-wrapTop));
  } else if(before){
    y = before.getBoundingClientRect().bottom - wrapTop;
  } else if(after){
    y = after.getBoundingClientRect().top - wrapTop;
  } else return;
  const line = document.createElement('div');
  line.id='nowLineEl'; line.className='nowLine'; line.style.top = Math.max(0,y)+'px';
  wrap.style.position='relative';
  wrap.appendChild(line);
}

/* Punten-tab: 10 Essentials per week, vast voor die week. */
let pickDraft = null; // tijdelijke keuze tijdens het kiezen van de week
function renderPoints(){
  if(!STATE.settings.pointsEnabled){
    $('#pointsCard').innerHTML = `<div style="font-size:12px;color:var(--muted);text-align:center;padding:30px 10px">Punten-tab staat uit. Zet hem aan via instellingen (⚙).</div>`;
    return;
  }
  const wk = weekKey(currentDate);
  const locked = STATE.weekSelections[wk];
  const N = CONFIG.pointsPerWeek;
  const head = `<div class="pointsHead"><div class="sectionLabel" style="margin:0">Punten — geen strafpunten</div><button class="editLink" id="btnEditPool">✎ bewerk</button></div>`;

  if(!locked){
    if(!pickDraft || pickDraft.wk!==wk) pickDraft = { wk, ids: proposedSelection(currentDate).slice() };
    const pool = (STATE.essentialPool||[]).filter(p=>!p.archived);
    const n = pickDraft.ids.length;
    $('#pointsCard').innerHTML = head + `
      <div class="pickInfo">Nieuwe week (vanaf ${esc(fmtDateShort(wk))}). Kies je ${N} Essentials — die staan daarna vast tot volgende week. <b>${n}/${N}</b> gekozen.</div>
      ${pool.map(p=>`<label class="pickRow"><input type="checkbox" data-pick="${p.id}" ${pickDraft.ids.includes(p.id)?'checked':''} ${(!pickDraft.ids.includes(p.id) && n>=N)?'disabled':''}> ${esc(p.name)}</label>`).join('')}
      <div style="margin-top:10px;display:flex;justify-content:flex-end"><button class="primaryBtn" id="btnLockWeek" ${n===N?'':'disabled'}>Vastzetten voor deze week</button></div>
    `;
    return;
  }

  const sc = essScore(currentDate);
  let weekHTML = '';
  for(let i=6;i>=0;i--){
    const iso = addDays(todayISO(), -i);
    const s2 = essScore(iso);
    const pct = s2.total ? Math.round(s2.done/s2.total*100) : 0;
    weekHTML += `<div class="pointsWeekCol"><div class="pointsWeekBar"><i style="height:${pct}%"></i></div><div class="pointsWeekLbl">${fromISO(iso).getDate()}</div></div>`;
  }
  $('#pointsCard').innerHTML = head + `
    <div style="font-size:11px;color:var(--muted)">${sc.done} / ${sc.total} vandaag</div>
    <div class="meter">${locked.map((_,i)=>`<div class="meterBox ${i<sc.done?'on':''}"></div>`).join('')}</div>
    ${locked.map(id=>{
      const p = poolItem(id);
      if(p.twice){
        const raw = essVal(currentDate,id); const n = Math.min(2, typeof raw==='number'?raw:(raw?2:0));
        return `<div class="essItem"><span class="essName">${esc(p.name)}</span><button class="essCount ${n>=2?'on':''}" data-esscount="${id}" title="Tik per bewust contact">${n}/2</button></div>`;

      return `<label class="essItem"><input type="checkbox" data-ess="${id}" ${essDone(currentDate,id)?'checked':''}> <span class="essName">${esc(p.name)}</span></label>`;
    }).join('')}

/* Punten in het logboek (Capture the moment) bijhouden. */
function logPoint(iso, id, on){
  STATE.log[iso] = STATE.log[iso] || [];
  STATE.log[iso] = STATE.log[iso].filter(e=>!(e.kind==='punt' && e.ref===id));
  if(on) STATE.log[iso].push({ id:uid('log'), time: iso===todayISO()?nowHHMM():'', kind:'punt', text: poolItem(id).name, ref:id });
}
function setEss(iso, id, value){
  STATE.essentialsChecked[iso] = STATE.essentialsChecked[iso] || {};
  STATE.essentialsChecked[iso][id] = value;
  logPoint(iso, id, essDone(iso, id));
}
function nowHHMM(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }

/* ---------- Capture the moment (logboek, kleine versie) ---------- */
let ctmOpen = false, ctmKind = null, ctmChoice = null;
function renderCtm(){
  const card = $('#ctmCard'); if(!card) return;
  const entries = (STATE.log[currentDate]||[]).slice().sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
  const f = peekDay(currentDate).framing || {};
  const sitText = f.situatie==='Anders' ? (f.situatieAnders||'Anders') : f.situatie;
  let html = `<div class="ctmHead" id="ctmToggle"><span class="sectionLabel" style="margin:0">Capture the moment</span><span class="cnt">${entries.length?entries.length+' · ':''}${ctmOpen?'▴':'▾'}</span></div>`;
  if(ctmOpen){
    const kinds = ['emotie','craving','notitie'];
    html += `<div class="ctmBody">
      <div class="ctmKinds">${kinds.map(k=>`<button class="ctmKind ${ctmKind===k?'on':''}" data-ctmkind="${k}"><span class="ctmDot" style="background:${CONFIG.logKinds[k].color}"></span>${CONFIG.logKinds[k].label}</button>`).join('')}</div>`;
    if(ctmKind){
      const choices = ctmKind==='emotie' ? CONFIG.emotieKeuzes : (ctmKind==='craving' ? CONFIG.cravingKeuzes : []);
      html += `<div class="ctmForm">
        ${choices.length?`<div class="ctmChoices">${choices.map(c=>`<button class="ctmChoice ${ctmChoice===c?'on':''}" data-ctmchoice="${esc(c)}">${esc(c)}</button>`).join('')}</div>`:''}
        <input type="text" id="ctmText" placeholder="${ctmKind==='notitie'?'Wat wil je vastleggen?':(ctmKind==='craving'?'Waar had je zin in? (optioneel)':'Of in eigen woorden… (optioneel)')}">
        <input type="text" id="ctmReason" placeholder="Reden (optioneel)">
        <div style="display:flex;justify-content:flex-end"><button class="primaryBtn" id="btnCtmSave">Vastleggen</button></div>
      </div>`;
    }
    html += `<div class="ctmList">
      ${sitText?`<div class="ctmEntry"><span class="tm"></span><span class="ctmDot" style="background:${CONFIG.logKinds.dagstructuur.color};margin-top:4px"></span><div class="tx"><span class="lbl">Dagstructuur</span>${esc(sitText)}</div></div>`:''}
      ${entries.map(e=>{ const k=CONFIG.logKinds[e.kind]||CONFIG.logKinds.notitie; return `<div class="ctmEntry">
        <span class="tm">${esc(e.time||'')}</span><span class="ctmDot" style="background:${k.color};margin-top:4px"></span>
        <div class="tx"><span class="lbl">${esc(k.label)}</span>${esc(e.text||'')}${e.reason?`<small>${esc(e.reason)}</small>`:''}</div>
        ${e.kind==='punt'?'':`<button data-ctmdel="${e.id}" title="Verwijderen">×</button>`}
      </div>`; }).join('')}
      ${(!entries.length && !sitText)?'<div style="font-size:11px;color:var(--faint);margin-top:4px">Nog niets vastgelegd vandaag.</div>':''}
    </div></div>`;
  }
  card.innerHTML = html;
}

/* ---------- overlays ---------- */
function openOverlay(id){ $('#overlayBg').classList.remove('hidden'); $('#'+id).classList.remove('hidden'); }
function closeOverlay(id){ $('#'+id).classList.add('hidden'); if(!$all('.panel:not(.hidden), .modal:not(.hidden)').length) $('#overlayBg').classList.add('hidden'); }
function closeAllOverlays(){ $all('.panel, .modal').forEach(p=>p.classList.add('hidden')); $('#overlayBg').classList.add('hidden'); $('#monthPopup').classList.add('hidden'); $('#addMenuPopup').classList.add('hidden'); }

/* ---------- toast ---------- */
function showToast(msg, onUndo){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${onUndo?'<button id="toastUndo">ongedaan maken</button>':''}`;
  t.classList.remove('hidden');
  if(onUndo){ $('#toastUndo').onclick = ()=>{ onUndo(); t.classList.add('hidden'); clearTimeout(t._timer); }; }
  clearTimeout(t._timer); t._timer = setTimeout(()=>t.classList.add('hidden'), 6000);
}

function renderAll(){
  $('#btnToday').textContent = fmtDateShort(currentDate) + (currentDate===todayISO()?' · vandaag':'');
  renderLive(); renderFraming(); renderBuilderList(); renderCalendar(); renderPoints(); updateUndoBtn();
}
function setView(v){
  currentView = v;
  $all('.tab').forEach(t=>t.classList.toggle('active', t.dataset.view===v));
  $all('.view').forEach(s=>s.classList.toggle('active', s.id==='view-'+v));
  if(v==='live') renderLive();
  if(v==='calendar') renderCalendar();
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('DOMContentLoaded', init);

function init(){
  loadState();
  $all('.tab').forEach(t=> t.addEventListener('click', ()=> setView(t.dataset.view)));

  $('#btnPrevDay').addEventListener('click', ()=>{ currentDate = addDays(currentDate,-1); renderAll(); });
  $('#btnNextDay').addEventListener('click', ()=>{ currentDate = addDays(currentDate,1); renderAll(); });
  $('#btnToday').addEventListener('click', ()=>{ currentDate = todayISO(); renderAll(); });

  $('#btnLibraryInline').addEventListener('click', ()=>{ renderLibrary(); openOverlay('libraryPanel'); });
  $('#btnTerug').addEventListener('click', ()=>{ renderTerug(null); openOverlay('terugPanel'); });
  $('#btnSettings').addEventListener('click', ()=>{ renderSettings(); openOverlay('settingsModal'); });
  $('#ankerBtn').addEventListener('click', ()=>{ renderAnker(); openOverlay('ankerModal'); });
  $('#terugTip').addEventListener('click', ()=>{ renderTerug(null); openOverlay('terugPanel'); });

  $('#overlayBg').addEventListener('click', closeAllOverlays);
  document.addEventListener('click', e=>{ const cx=e.target.closest('[data-close]'); if(cx) closeOverlay(cx.dataset.close); });

  // toevoeg-menu (groene +)
  $('#btnAddMenu').addEventListener('click', e=>{
    e.stopPropagation(); renderAddMenu(); $('#addMenuPopup').classList.toggle('hidden');
  });
  document.addEventListener('click', e=>{
    if(!$('#addMenuPopup').classList.contains('hidden') && !e.target.closest('#addMenuPopup') && !e.target.closest('#btnAddMenu')){
      $('#addMenuPopup').classList.add('hidden');
    }
  });

  // legenda toggles
  document.addEventListener('click', e=>{
    const lg = e.target.closest('[data-legend]');
    if(lg){ const box=$('#'+lg.dataset.legend); box.classList.toggle('open'); lg.textContent = box.classList.contains('open')?'legenda ▴':'legenda ▾'; }
  });

  // library categorie in-/uitklappen
  document.addEventListener('click', e=>{
    const cat = e.target.closest('[data-libcat]');
    if(cat){ const k=cat.dataset.libcat; libraryOpenCats[k] = !(libraryOpenCats[k]!==false); renderLibrary(); }
  });

  // kalender: weekstrip jump + maandpopup
  document.addEventListener('click', e=>{
    const jump = e.target.closest('[data-jump]');
    if(jump){ currentDate = jump.dataset.jump; $('#monthPopup').classList.add('hidden'); renderAll(); return; }
    if(e.target.id==='calLabelBtn'){ renderMonthPopup(); $('#monthPopup').classList.toggle('hidden'); return; }
    if(e.target.id==='btnJumpToday'){ currentDate = todayISO(); $('#monthPopup').classList.add('hidden'); renderAll(); return; }
  });

  // add item buttons (builder)
  document.addEventListener('click', e=>{
    const addBtn = e.target.closest('[data-add]');
    if(addBtn){
      const day = getDay(currentDate);
      const it = newItem(addBtn.dataset.add);
      it.order = day.items.length; day.items.push(it); it._view = 'max';
      saveState(); renderAll();
      $('#addMenuPopup').classList.add('hidden');
    }
  });

  // framing
  document.addEventListener('input', e=>{ const f=e.target.closest('[data-framing]'); if(f && !f.matches('select')){ getDay(currentDate).framing[f.dataset.framing]=f.value; saveState(); } });
  document.addEventListener('change', e=>{ const f=e.target.closest('select[data-framing]'); if(f){ getDay(currentDate).framing[f.dataset.framing]=f.value; saveState(); renderFraming(); renderCtm(); } });
  document.addEventListener('focusout', e=>{ const f=e.target.closest('input[data-framing]'); if(f){ renderLive(); } });

  // mood
  document.addEventListener('click', e=>{
    const m = e.target.closest('[data-mood]');
    if(m){ STATE.moods[currentDate]=m.dataset.mood; saveState(); renderReflect(); renderCalendar(); }
  });

  // motief open/edit
  document.addEventListener('click', e=>{
    const mo = e.target.closest('[data-motifopen]');
    if(mo){
      const card = mo.closest('.item'); const day = getDay(currentDate);
      const it = day.items.find(x=>x.id===card.dataset.id);
      if(it.locked) return;
      it._motifEditing = true; renderAll();
      setTimeout(()=>{ const inp=$('.item[data-id="'+it.id+'"] .motifInput'); if(inp){ inp.focus(); } }, 0);
    }
  });
  document.addEventListener('focusout', e=>{
    const mi = e.target.closest('.motifInput');
    if(mi){
      const card = mi.closest('.item'); const day = getDay(currentDate);
      const it = day.items.find(x=>x.id===card.dataset.id);
      it._motifEditing = false; saveState(); renderAll();
    }
  });

  // generieke item-veld inputs
  document.addEventListener('input', e=>{
    const el = e.target.closest('[data-field]');
    if(el && !el.matches('select') && !el.classList.contains('motifInput')){
      const card = el.closest('.item'); if(!card) return;
      const day = getDay(currentDate);
      const it = day.items.find(x=>x.id===card.dataset.id); if(!it) return;
      if(it.locked) return;
      const field = el.dataset.field;
      if(field==='durationIdx'){ it.duration = CONFIG.durationSteps[+el.value]; el.closest('.rangeRow').querySelector('.durBadge').textContent = fmtDuration(it.duration); }
      else { it[field] = el.value; }
      saveState(); syncTemplate(it);
    }
    const mi = e.target.closest('.motifInput');
    if(mi){
      const card = mi.closest('.item'); const day=getDay(currentDate);
      const it = day.items.find(x=>x.id===card.dataset.id);
      it.why = mi.value; saveState(); syncTemplate(it);
    }
  });

  // selects (tag, essentialLink, windDown) + tijd
  document.addEventListener('change', e=>{
    const sel = e.target.closest('select[data-field]');
    if(sel){
      const card = sel.closest('.item'); if(!card) return;
      const day = getDay(currentDate); const it = day.items.find(x=>x.id===card.dataset.id); if(!it) return;
      if(it.locked) return;
      const v = sel.dataset.field==='windDown' ? +sel.value : sel.value;
      it[sel.dataset.field] = v; saveState(); syncTemplate(it); renderAll(); return;
    }
    const timeInp = e.target.closest('input[type=time][data-field]');
    if(timeInp){
      const card = timeInp.closest('.item'); if(!card) return;
      const day = getDay(currentDate); const it = day.items.find(x=>x.id===card.dataset.id); if(!it) return;
      if(it.locked) return;
      it.time = timeInp.value; saveState(); syncTemplate(it); renderAll();
    }
  });

  // tijd wijzigen rechtstreeks vanuit de Kalender-tijdlijn (flexibele punten)
  document.addEventListener('change', e=>{
    const tt = e.target.closest('[data-tltime]');
    if(tt){
      const day = getDay(currentDate); const it = day.items.find(x=>x.id===tt.dataset.tltime);
      if(it && !it.locked){ it.time = tt.value; saveState(); syncTemplate(it); renderAll(); }
    }
  });

  // icoon kiezen
  document.addEventListener('click', e=>{
    const ib = e.target.closest('[data-seticon]');
    if(ib){
      const card = ib.closest('.item'); const day=getDay(currentDate);
      const it = day.items.find(x=>x.id===card.dataset.id);
      if(it.locked) return;
      it.icon = ib.dataset.seticon; saveState(); syncTemplate(it); renderAll();
    }
  });

  // done checkbox (builder-kaart) — afvinken mag altijd, ook vergrendeld
  document.addEventListener('change', e=>{
    const chk = e.target.closest('input.done[data-field="done"]');
    if(chk){
      const card = chk.closest('.item'); if(!card) return;
      const day = getDay(currentDate); const it = day.items.find(x=>x.id===card.dataset.id); if(!it) return;
      it.done = chk.checked;
      if(it.done) onItemDone(it);
      saveState(); renderAll();
    }
  });
  // done checkbox (kalender-tijdlijn)
  document.addEventListener('change', e=>{
    const tl = e.target.closest('.tlCheck[data-tlid]');
    if(tl){
      const day = getDay(currentDate); const it = day.items.find(x=>x.id===tl.dataset.tlid); if(!it) return;
      it.done = tl.checked;
      if(it.done) onItemDone(it);
      saveState(); renderAll();
    }
  });

  // klaar — volgende (live)
  document.addEventListener('click', e=>{
    const d = e.target.closest('[data-donenow]');
    if(d){
      const day = getDay(currentDate); const it = day.items.find(x=>x.id===d.dataset.donenow); if(!it) return;
      it.done = true; onItemDone(it);
      saveState(); renderAll();
    }
  });

  // reorder / toggles / expand / delete / addsub / savelib / lock
  document.addEventListener('click', e=>{
    const card = e.target.closest('.item');

    const moveBtn = e.target.closest('[data-move]');
    if(moveBtn && card){
      const day = getDay(currentDate);
      const items = orderedItems(day).filter(it=>!it.time);
      const i = items.findIndex(x=>x.id===card.dataset.id);
      const j = i + (moveBtn.dataset.move==='up'?-1:1);
      if(i>=0 && j>=0 && j<items.length){ const tmp=items[i].order; items[i].order=items[j].order; items[j].order=tmp; saveState(); renderAll(); }

    const saveLib = e.target.closest('[data-savelib]');

  document.addEventListener('change', e=>{

    if(e.target.id==='btnCtmSave'){

    }

    if(e.target.id==='oneLinerInput'){ getDay(currentDate).closing.oneLiner=e.target.value; saveState(); }

  let dragState = null;
  document.addEventListener('pointerdown', e=>{
    const handle = e.target.closest('.tlHandle');
    if(!handle) return;
    const row = handle.closest('.tlRow');
    dragState = { id: row.dataset.id };
    row.classList.add('dragging');
    e.preventDefault();
  });
  document.addEventListener('pointermove', e=>{
    if(!dragState) return;
    const wrap = $('#dayTimeline'); if(!wrap) return;
    const rows = $all('.tlRow', wrap);
    $all('.tlRow.dragOver', wrap).forEach(r=>r.classList.remove('dragOver'));
    const under = rows.find(r=>{ const rect=r.getBoundingClientRect(); return e.clientY>=rect.top && e.clientY<=rect.bottom; });
    if(under && under.dataset.id!==dragState.id) under.classList.add('dragOver');
  });
  document.addEventListener('pointerup', e=>{
    if(!dragState) return;
    const wrap = $('#dayTimeline');
    const rows = wrap ? $all('.tlRow', wrap) : [];
    const under = rows.find(r=>{ const rect=r.getBoundingClientRect(); return e.clientY>=rect.top && e.clientY<=rect.bottom; });
    $all('.tlRow').forEach(r=>{ r.classList.remove('dragging'); r.classList.remove('dragOver'); });
    if(under && under.dataset.id!==dragState.id){
      const day = getDay(currentDate);
      const dragIt = day.items.find(x=>x.id===dragState.id);
      const targetIt = day.items.find(x=>x.id===under.dataset.id);
      if(dragIt && targetIt && !dragIt.locked){
        const rect = under.getBoundingClientRect();
        const before = (e.clientY - rect.top) < rect.height/2;
        if(targetIt.time) dragIt.time = targetIt.time;
        dragIt.order = before ? (targetIt.order||0) - 0.5 : (targetIt.order||0) + 0.5;
        saveState(); syncTemplate(dragIt); renderAll();
      }
    }
    dragState = null;
  });

  renderAll();

  // klok-gestuurde auto-refresh (alleen de zichtbare, tijdgevoelige tab)
  setInterval(()=>{
    if(currentView==='live') renderLive();

  // PWA: service worker registreren voor offline-gebruik (alleen via http/https,
  // niet via file://; zie LEESMIJ.txt voor installatie-instructies).
  if('serviceWorker' in navigator && (location.protocol==='http:' || location.protocol==='https:')){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('service-worker.js').catch(()=>{});
    });
  }
}

/* ---------- herstelknop: laatste 3 verwijderde items, 24 uur geldig ---------- */
const TRASH_MAX = 3, TRASH_HOURS = 24;
function purgeTrash(){
  const cutoff = Date.now() - TRASH_HOURS*3600*1000;
  STATE.trash = (STATE.trash||[]).filter(t=>t.deletedAt >= cutoff).slice(-TRASH_MAX);
}
function pushTrash(item, date){
  purgeTrash();
  STATE.trash.push({ item: JSON.parse(JSON.stringify(item)), date, deletedAt: Date.now() });
  STATE.trash = STATE.trash.slice(-TRASH_MAX);
}
function undoLast(){
  purgeTrash();
  const t = STATE.trash.pop();
  if(!t){ updateUndoBtn(); return; }
  const day = getDay(t.date);
  if(!day.items.find(x=>x.id===t.item.id)) day.items.push(t.item);
  saveState(); currentDate = t.date; renderAll();
  showToast('Hersteld: '+(t.item.title||TYPE_LABEL[t.item.type]));
}
function updateUndoBtn(){
  const b = $('#btnUndo'); if(!b) return;
  purgeTrash();
  b.disabled = STATE.trash.length===0;
  b.title = STATE.trash.length ? ('Herstel laatst verwijderde ('+STATE.trash.length+')') : 'Niets te herstellen';
}

/* ---------- ∞ = herhalen (dagen + tijd) ---------- */
let repeatTargetId = null;
function openRepeatModal(itemId){
  repeatTargetId = itemId;
  const it = getDay(currentDate).items.find(x=>x.id===itemId);
  const days = (it.recurring && it.recurringTemplateId)
    ? ((STATE.recurringTemplates.find(t=>t.templateId===it.recurringTemplateId)||{}).repeatDays || [])
    : (it.lockSettings.repeatDays||[]);
  $('#repeatBody').innerHTML = `
    <div style="font-size:11px;color:var(--muted);margin-bottom:6px">${it.recurring?'Dit item herhaalt.':'Dit item herhaalt nog niet.'}</div>
    <label style="font-size:10px;color:var(--muted)">Herhaaldagen (leeg = elke dag)</label>
    <div class="lockGrid">${WEEKDAYS_MON0.map((d,i)=>`<button data-repday data-dayidx="${i}" class="${days.includes(i)?'on':''}">${d}</button>`).join('')}</div>
    ${it.allDay?'':`<label style="font-size:10px;color:var(--muted);margin-top:8px;display:block">Tijd</label>
    <input type="time" id="repeatTime" value="${it.time||''}" style="border:1px solid var(--line);border-radius:6px;padding:5px;font-size:12px">`}
    <div class="detailActions">
      <button id="btnSaveRepeat">${it.recurring?'Opslaan':'Herhalen aanzetten'}</button>
      ${it.recurring?'<button id="btnStopRepeat">Herhalen uitzetten</button>':''}
    </div>`;
  openOverlay('repeatModal');
}
function saveRepeatFromModal(){
  const it = getDay(currentDate).items.find(x=>x.id===repeatTargetId); if(!it) return;
  const days = $all('#repeatBody [data-repday].on').map(b=>+b.dataset.dayidx);
  const tm = $('#repeatTime'); if(tm && tm.value) it.time = tm.value;
  it.lockSettings.repeatDays = days.slice();
  if(!it.recurring){
    it.recurring = true; it.recurringTemplateId = uid('tpl');
    STATE.recurringTemplates.push({ templateId:it.recurringTemplateId, repeatDays:days.slice(), data:{} });
  } else {
    const t = STATE.recurringTemplates.find(x=>x.templateId===it.recurringTemplateId);
    if(t) t.repeatDays = days.slice();
  }
  syncTemplate(it);
  saveState(); closeOverlay('repeatModal'); renderAll();
}
function stopRepeatFromModal(){
  const it = getDay(currentDate).items.find(x=>x.id===repeatTargetId); if(!it) return;
  STATE.recurringTemplates = STATE.recurringTemplates.filter(t=>t.templateId!==it.recurringTemplateId);
  it.recurring = false; it.recurringTemplateId = null;
  saveState(); closeOverlay('repeatModal'); renderAll();
}

/* =====================================================================
   DAG TOEVOEGEN — één dag uit een apart dagbestand toevoegen aan de
   bestaande data. Vervangt/verwijdert nooit andere dagen, instellingen,
   punten, library of stemmingen.
   ===================================================================== */
const DAG_IMPORT_TYPES = ['flex','vast','werkblok','joy','health'];
let pendingDagImport = null; // {datum, items}

/* Geeft null terug als geldig, anders een korte Nederlandse foutmelding. */
function validateDagJSON(obj){
  if(!obj || typeof obj!=='object') return 'Geen geldig bestand.';
  if(obj.type !== 'cr4-dag') return 'Dit is geen CR.4-dagbestand.';
  if(obj.versie !== 1) return 'Onbekende versie van dit dagbestand.';
  if(typeof obj.datum!=='string' || !/^\d{4}-\d{2}-\d{2}$/.test(obj.datum)) return 'Geen geldige datum in het bestand.';
  if(!Array.isArray(obj.items) || obj.items.length===0) return 'Geen items gevonden in het bestand.';
  for(const raw of obj.items){
    if(!DAG_IMPORT_TYPES.includes(raw.soort)) return 'Onbekend itemtype: "'+(raw.soort||'?')+'".';
    if(raw.tijd!=null && !/^([01]\d|2[0-3]):[0-5]\d$/.test(raw.tijd)) return 'Ongeldige tijd bij "'+(raw.titel||'een item')+'".';
    if(raw.duur!=null && (typeof raw.duur!=='number' || raw.duur<0)) return 'Ongeldige duur bij "'+(raw.titel||'een item')+'".';
  }
  return null;
}
function itemFromDagJSON(raw){
  const it = newItem(raw.soort);
  it.title = raw.titel || '';
  if(raw.tijd) it.time = raw.tijd;
  if(raw.duur!=null) it.duration = raw.duur;
  if(raw.locatie) it.location = raw.locatie;
  if(raw.motief) it.why = raw.motief;
  return it;
}
function handleDagImportFile(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    let obj;
    try{ obj = JSON.parse(reader.result); }
    catch(e){ showToast('Kon bestand niet lezen — geen geldig JSON-bestand.'); return; }
    const err = validateDagJSON(obj);
    if(err){ showToast(err); return; }
    const items = obj.items.map(itemFromDagJSON);
    const existing = STATE.days[obj.datum];
    if(existing && existing.items.length){
      pendingDagImport = { datum: obj.datum, items };
      openDagImportChoiceModal(obj.datum, items.length, existing.items.length);
    } else {
      commitDagImport(obj.datum, items, 'add');
    }
  };
  reader.onerror = ()=>{ showToast('Kon bestand niet lezen.'); };
  reader.readAsText(file);
}
function openDagImportChoiceModal(datum, newCount, existingCount){
  $('#dagImportBody').innerHTML = `
    <div style="font-size:12px;color:var(--muted);margin-bottom:10px">
      ${esc(fmtDateShort(datum))} heeft al ${pluralOnderdeel(existingCount)}.
      Wat wil je doen met de ${newCount} nieuwe uit dit bestand?
    </div>
    <div class="detailActions">
      <button id="btnDagImportAdd">Toevoegen aan bestaande dag</button>
      <button id="btnDagImportOverwrite">Overschrijven</button>
      <button id="btnDagImportCancel">Annuleren</button>
    </div>
  `;
  openOverlay('dagImportModal');
}
function commitDagImport(datum, items, mode){
  const day = getDay(datum);
  if(mode==='overwrite') day.items = [];
  const startOrder = day.items.length;
  items.forEach((it,i)=>{ it.order = startOrder+i; day.items.push(it); });
  saveState();
  currentDate = datum;
  setView('calendar');
  renderAll();
  showToast(pluralOnderdeel(items.length)+' toegevoegd aan '+fmtDateShort(datum)+'.');
}
</script>
</body>
</html>
